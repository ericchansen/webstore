name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '20'
  AZURE_RESOURCE_GROUP: rg-webstore-${{ inputs.environment || 'dev' }}
  SECRET_ROTATION_THRESHOLD_DAYS: '14'

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client
        run: npx prisma generate
      
      - name: Run tests
        run: npm run test
      
      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Get ACR credentials
        id: acr
        run: |
          ACR_NAME="acrwebstore${{ inputs.environment || 'dev' }}"
          echo "name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "server=$ACR_NAME.azurecr.io" >> $GITHUB_OUTPUT
      
      - name: Login to ACR
        run: az acr login --name ${{ steps.acr.outputs.name }}
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.acr.outputs.server }}/webstore
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Deploy Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            ENVIRONMENT="${{ inputs.environment || 'dev' }}"
            RESOURCE_GROUP="${{ env.AZURE_RESOURCE_GROUP }}"
            POSTGRES_SERVER="psql-webstore-${ENVIRONMENT}"
            CONTAINER_APP="ca-webstore-${ENVIRONMENT}"
            SECRET_NAME="DATABASE-URL"
            ROTATION_THRESHOLD_DAYS="${{ env.SECRET_ROTATION_THRESHOLD_DAYS }}"
            ACR_SERVER="acrwebstore${ENVIRONMENT}.azurecr.io"
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            IMAGE="${ACR_SERVER}/webstore:${SHORT_SHA}"

            PG_STATE=$(az postgres flexible-server show \
              --name "$POSTGRES_SERVER" \
              --resource-group "$RESOURCE_GROUP" \
              --query "state" -o tsv 2>/dev/null || echo "NotFound")

            if [ "$PG_STATE" != "Ready" ]; then
              echo "::error::PostgreSQL server $POSTGRES_SERVER is '$PG_STATE'. This workflow does not start/stop databases. Restore availability with Azure-native automation or operations, then redeploy."
              exit 1
            fi

            KV_NAME=$(az keyvault list \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?starts_with(name, 'kv-webstore-${ENVIRONMENT}-')].name | [0]" \
              -o tsv)

            if [ -z "$KV_NAME" ]; then
              echo "::error::No Key Vault found in $RESOURCE_GROUP with expected prefix kv-webstore-${ENVIRONMENT}-"
              exit 1
            fi

            SECRET_EXPIRY=$(az keyvault secret show \
              --vault-name "$KV_NAME" \
              --name "$SECRET_NAME" \
              --query "attributes.expires" -o tsv 2>/dev/null || true)

            if [ -z "$SECRET_EXPIRY" ]; then
              echo "::error::Key Vault secret $SECRET_NAME is missing expiration metadata."
              exit 1
            else
              NOW_EPOCH=$(date -u +%s)
              EXPIRY_EPOCH=$(date -u -d "$SECRET_EXPIRY" +%s)
              DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))

              if [ "$DAYS_LEFT" -lt "$ROTATION_THRESHOLD_DAYS" ]; then
                echo "::error::Key Vault secret $SECRET_NAME expires in $DAYS_LEFT day(s), below threshold $ROTATION_THRESHOLD_DAYS."
                echo "Rotate the secret using an Azure-native runbook/process, then redeploy."
                exit 1
              fi
            fi

            # Fetch the database URL from Key Vault for Container App secrets
            DATABASE_URL=$(az keyvault secret show \
              --vault-name "$KV_NAME" \
              --name "$SECRET_NAME" \
              --query "value" -o tsv)

            # Create-or-update pattern: first deploy creates the Container App;
            # subsequent deploys just update the image.
            if az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
              az containerapp update \
                --name "$CONTAINER_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --image "$IMAGE"
            else
              az containerapp create \
                --name "$CONTAINER_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --environment "cae-webstore-${ENVIRONMENT}" \
                --image "$IMAGE" \
                --registry-server "$ACR_SERVER" \
                --target-port 3000 \
                --ingress external \
                --min-replicas 0 \
                --max-replicas 3 \
                --secrets "database-url=$DATABASE_URL" \
                --env-vars "DATABASE_URL=secretref:database-url" "NODE_ENV=production"
            fi

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Get App URL
        id: app-url
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            ENVIRONMENT="${{ inputs.environment || 'dev' }}"
            FQDN=$(az containerapp show \
              --name ca-webstore-${ENVIRONMENT} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "url=https://${FQDN}" >> $GITHUB_OUTPUT
      
      - name: Run smoke tests against deployed app
        run: npx playwright test --project="Desktop Edge" || npx playwright test --project="chromium"
        env:
          BASE_URL: ${{ steps.app-url.outputs.url }}
          CI: true
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7
